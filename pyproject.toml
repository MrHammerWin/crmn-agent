[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crmn-agent"
version = "0.1.0"
description = "A reproducible CRMN-inspired controller for interactive language agents"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.9,<3", "numpy>=1.24,<3"]

[project.optional-dependencies]
openai = ["openai>=1.60"]
local = ["mlx-lm>=0.20,<1; sys_platform == 'darwin'", "outlines>=1,<2"]
benchmarks = ["textcraft==0.0.3", "minigrid @ git+https://github.com/BartekCupial/Minigrid.git@cf73dd148e51276bd675a37e3bfb0bf2b42329b2", "gymnasium>=0.29,<2", "alfworld==0.4.2"]
dev = ["pytest>=8,<9", "ruff>=0.9"]

[project.scripts]
crmn = "crmn_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

